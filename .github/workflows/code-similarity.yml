name: Scancode Toolkit
on:
  workflow_dispatch:

jobs:
  scancode:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install scancode-toolkit
        run: pip install scancode-toolkit

      - name: Run scan
        run: |
          scancode \
            --license \
            --copyright \
            --json-pp scancode-report.json \
            .

      - name: Upload results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scancode-report
          path: scancode-report.json

      - name: Fail on license policy violations
        run: |
          python - <<'EOF'
          import json, sys
          with open("scancode-report.json") as f:
              report = json.load(f)
          violations = [
              file["path"]
              for file in report.get("files", [])
              for lic in file.get("licenses", [])
              if lic.get("category") in ("Copyleft", "Proprietary Free")
          ]
          if violations:
              print("License violations found in:")
              print("\n".join(violations))
              sys.exit(1)
          print("No violations found.")
          EOF

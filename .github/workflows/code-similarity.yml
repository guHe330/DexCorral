name: Scancode Toolkit
on:
  workflow_dispatch:

# Checkout and artifact upload only; nothing here writes to the repo.
permissions:
  contents: read

jobs:
  scancode:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install scancode-toolkit
        run: pip install scancode-toolkit==32.5.0

      - name: Run scan
        run: |
          scancode \
            --license \
            --copyright \
            --json-pp scancode-report.json \
            .

      # Report only, no pass/fail gate: deciding which licenses are compatible
      # with this GPL-3.0 project is a review call, so read the report by hand.
      - name: Upload results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scancode-report
          path: scancode-report.json

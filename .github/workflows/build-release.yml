name: Build and Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch all history for tags

    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v2

    - name: Setup CMake
      uses: lukka/get-cmake@latest

    - name: Get version from tag
      id: get_version
      shell: pwsh
      run: |
        $tag = "${{ github.ref_name }}"
        $version = $tag -replace '^v', ''
        $msixVersion = "$version.0"  # MSIX requires 4-part version
        Write-Host "Version: $version (tag: $tag)"
        Write-Host "MSIX Version: $msixVersion"
        echo "version=$version" >> $env:GITHUB_OUTPUT
        echo "msix_version=$msixVersion" >> $env:GITHUB_OUTPUT
        echo "tag=$tag" >> $env:GITHUB_OUTPUT

    - name: Update CMakeLists.txt version
      shell: pwsh
      run: |
        $version = "${{ steps.get_version.outputs.version }}"
        $cmakePath = "DexCorral/CMakeLists.txt"
        $content = Get-Content $cmakePath -Raw
        $content = $content -replace 'project\(DexCorral VERSION \d+\.\d+\.\d+', "project(DexCorral VERSION $version"
        Set-Content $cmakePath -Value $content
        Write-Host "Updated CMakeLists.txt to version $version"

    - name: Update Version.h
      shell: pwsh
      run: |
        $version = "${{ steps.get_version.outputs.version }}"
        $parts = $version -split '\.'
        $major = $parts[0]
        $minor = $parts[1]
        $patch = $parts[2]
        $versionH = "DexCorral/include/Version.h"
        $content = Get-Content $versionH -Raw
        $content = $content -replace '#define DEXCORRAL_VERSION L"[^"]*"', "#define DEXCORRAL_VERSION L""$version"""
        $content = $content -replace '#define DEXCORRAL_VERSION_MAJOR \d+', "#define DEXCORRAL_VERSION_MAJOR $major"
        $content = $content -replace '#define DEXCORRAL_VERSION_MINOR \d+', "#define DEXCORRAL_VERSION_MINOR $minor"
        $content = $content -replace '#define DEXCORRAL_VERSION_PATCH \d+', "#define DEXCORRAL_VERSION_PATCH $patch"
        Set-Content $versionH -Value $content
        Write-Host "Updated Version.h to $version"

    - name: Configure CMake
      run: cmake -S DexCorral -B DexCorral/build -G "Visual Studio 17 2022" -A x64

    - name: Build Release
      run: cmake --build DexCorral/build --config Release

    - name: Prepare portable readme
      shell: pwsh
      run: |
        # Copy the PortableReadme.txt from Distribute folder
        Copy-Item "Distribute/PortableReadme.txt" -Destination "portable_readme.txt"
        Write-Host "Copied PortableReadme.txt for portable package"

    - name: Create Portable Package
      shell: pwsh
      run: |
        $version = "${{ steps.get_version.outputs.version }}"
        
        # Create staging directory
        New-Item -ItemType Directory -Force -Path "package"
        
        # Copy files
        Copy-Item "DexCorral/build/Release/DexCorral.exe" -Destination "package/"
        Copy-Item "DexCorral/build/Release/DexCorralHook.dll" -Destination "package/"
        Copy-Item "LICENSE" -Destination "package/"
        Copy-Item "portable_readme.txt" -Destination "package/readme.txt"
        
        # Create zip
        Compress-Archive -Path "package/*" -DestinationPath "Portable_DexCorral.zip" -Force
        
        Write-Host "Created Portable_DexCorral.zip with contents:"
        Get-ChildItem "package"

    - name: Build MSIX Package
      shell: pwsh
      run: |
        $version = "${{ steps.get_version.outputs.msix_version }}"
        Write-Host "Building MSIX package version $version"

        # Run the MSIX build script
        cd installer/msix
        .\build-msix.ps1 -Version $version -Sign

        # Rename output with version number for clarity
        $msixFile = "output/DexCorral_$version.msix"
        $renamedMsix = "../../DexCorral_$version.msix"

        if (Test-Path $msixFile) {
          Copy-Item $msixFile $renamedMsix
          Write-Host "MSIX package created: $renamedMsix"
        } else {
          Write-Error "MSIX package not found at $msixFile"
          exit 1
        }

    - name: Prepare release notes
      shell: pwsh
      run: |
        $version = "${{ steps.get_version.outputs.version }}"
        $body = Get-Content "Distribute/RELEASE_TEMPLATE.md" -Raw
        $body = $body -replace '\$\{VERSION\}', $version
        Set-Content "release_notes.md" -Value $body

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.get_version.outputs.tag }}
        name: DexCorral ${{ steps.get_version.outputs.tag }}
        body_path: release_notes.md
        files: |
          Portable_DexCorral.zip
          DexCorral_${{ steps.get_version.outputs.msix_version }}.msix
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

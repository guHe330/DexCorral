name: Build and Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch all history for tags

    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v2

    - name: Setup CMake
      uses: lukka/get-cmake@latest

    - name: Get version from tag
      id: get_version
      shell: pwsh
      run: |
        $tag = "${{ github.ref_name }}"
        $version = $tag -replace '^v', ''
        Write-Host "Version: $version (tag: $tag)"
        echo "version=$version" >> $env:GITHUB_OUTPUT
        echo "tag=$tag" >> $env:GITHUB_OUTPUT

    - name: Update CMakeLists.txt version
      shell: pwsh
      run: |
        $version = "${{ steps.get_version.outputs.version }}"
        $cmakePath = "DexCorralCpp/CMakeLists.txt"
        $content = Get-Content $cmakePath -Raw
        $content = $content -replace 'project\(DexCorral VERSION \d+\.\d+\.\d+', "project(DexCorral VERSION $version"
        Set-Content $cmakePath -Value $content
        Write-Host "Updated CMakeLists.txt to version $version"

    - name: Configure CMake
      run: cmake -S DexCorralCpp -B DexCorralCpp/build -G "Visual Studio 17 2022" -A x64

    - name: Build Release
      run: cmake --build DexCorralCpp/build --config Release

    - name: Prepare portable readme
      shell: pwsh
      run: |
        # Copy the PortableReadme.txt from Distribute folder
        Copy-Item "Distribute/PortableReadme.txt" -Destination "portable_readme.txt"
        Write-Host "Copied PortableReadme.txt for portable package"

    - name: Create Portable Package
      shell: pwsh
      run: |
        $version = "${{ steps.get_version.outputs.version }}"
        
        # Create staging directory
        New-Item -ItemType Directory -Force -Path "package"
        
        # Copy files
        Copy-Item "DexCorralCpp/build/Release/DexCorral.exe" -Destination "package/"
        Copy-Item "DexCorralCpp/build/Release/DexCorral.Watchdog.exe" -Destination "package/"
        Copy-Item "DexCorralCpp/build/Release/CorralHook.dll" -Destination "package/"
        Copy-Item "LICENSE" -Destination "package/"
        Copy-Item "portable_readme.txt" -Destination "package/readme.txt"
        
        # Create zip
        Compress-Archive -Path "package/*" -DestinationPath "Portable_DexCorral.zip" -Force
        
        Write-Host "Created Portable_DexCorral.zip with contents:"
        Get-ChildItem "package"

    - name: Prepare release notes
      shell: pwsh
      run: |
        $version = "${{ steps.get_version.outputs.version }}"
        $body = Get-Content "Distribute/RELEASE_TEMPLATE.md" -Raw
        $body = $body -replace '\$\{VERSION\}', $version
        Set-Content "release_notes.md" -Value $body

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.get_version.outputs.tag }}
        name: DexCorral ${{ steps.get_version.outputs.tag }}
        body_path: release_notes.md
        files: |
          Portable_DexCorral.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

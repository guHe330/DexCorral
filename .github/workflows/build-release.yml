name: Build and Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    # windows-latest rolled forward to an image with VS 2026 (no VS 2022),
    # which breaks the "Visual Studio 17 2022" CMake generator. Pin to the
    # image that still ships VS 2022.
    # ToDo move to ninja
    runs-on: windows-2022

    steps:
    - name: Checkout repository
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      with:
        fetch-depth: 0  # Fetch all history for tags

    - name: Setup MSVC
      uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

    - name: Setup CMake
      uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2

    - name: Get version from tag
      id: get_version
      shell: pwsh
      run: |
        $tag = "${{ github.ref_name }}"
        $version = $tag -replace '^v', ''
        Write-Host "Version: $version (tag: $tag)"
        echo "version=$version" >> $env:GITHUB_OUTPUT
        echo "tag=$tag" >> $env:GITHUB_OUTPUT

    - name: Verify Version.h matches tag
      shell: pwsh
      run: |
        # Version.h is the single source of truth (CMakeLists + .rc derive from it).
        # The tag must match it exactly, so a release can't ship a stale version.
        $version = "${{ steps.get_version.outputs.version }}"
        $parts = $version -split '\.'
        if ($parts.Count -ne 3) { throw "Tag version '$version' is not X.Y.Z" }
        $major = $parts[0]; $minor = $parts[1]; $patch = $parts[2]

        $versionH = Get-Content "DexCorral/include/Version.h" -Raw

        if ($versionH -notmatch '#define DEXCORRAL_VERSION L"([^"]*)"') {
            throw "Could not find DEXCORRAL_VERSION in Version.h"
        }
        $fileVersion = $Matches[1]
        if ($fileVersion -ne $version) {
            throw "Tag v$version does not match Version.h ($fileVersion). Bump Version.h before tagging."
        }

        $checks = @{
            'DEXCORRAL_VERSION_MAJOR'  = $major
            'DEXCORRAL_VERSION_MINOR'  = $minor
            'DEXCORRAL_VERSION_PATCH'  = $patch
        }
        foreach ($name in $checks.Keys) {
            if ($versionH -notmatch "#define $name (\d+)") { throw "Could not find $name in Version.h" }
            if ($Matches[1] -ne $checks[$name]) {
                throw "$name ($($Matches[1])) does not match tag part ($($checks[$name]))"
            }
        }

        $expectedDotted = "$major.$minor.$patch.0"
        if ($versionH -notmatch '#define DEXCORRAL_VERSION_DOTTED "([^"]*)"') {
            throw "Could not find DEXCORRAL_VERSION_DOTTED in Version.h"
        }
        if ($Matches[1] -ne $expectedDotted) {
            throw "DEXCORRAL_VERSION_DOTTED ($($Matches[1])) does not match expected $expectedDotted"
        }

        Write-Host "Version OK: Version.h is consistent with tag v$version"

    # security-guards.yml runs on branch pushes, not on tags, so it never sees a
    # release. Re-check the SBOM here: this is the last point before artifacts are
    # published, and a released SBOM naming the wrong version is worse than useless.
    - name: Verify the SBOM describes this release
      shell: pwsh
      run: |
        $version = "${{ steps.get_version.outputs.version }}"
        $sbom = Get-Content "sbom/dexcorral.cdx.json" -Raw | ConvertFrom-Json

        $sbomVersion = $sbom.metadata.component.version
        if ($sbomVersion -ne $version) {
            throw "sbom/dexcorral.cdx.json says $sbomVersion, releasing $version. Bump metadata.component.version and its purl."
        }

        $expectedPurl = "pkg:github/guHe330/DexCorral@v$version"
        if ($sbom.metadata.component.purl -ne $expectedPurl) {
            throw "SBOM purl is $($sbom.metadata.component.purl), expected $expectedPurl"
        }

        # The shipped dependency must still be the one the SBOM vouches for.
        $json = $sbom.components | Where-Object { $_.name -eq 'json' }
        if (-not $json) { throw "No nlohmann/json component in the SBOM" }
        $want = ($json.hashes | Where-Object { $_.alg -eq 'SHA-256' }).content
        $got = (Get-FileHash "DexCorral/include/nlohmann/json.hpp" -Algorithm SHA256).Hash.ToLower()
        if ($want -ne $got) {
            throw "json.hpp hash $got does not match the SBOM ($want)"
        }

        Write-Host "SBOM OK: describes $version, nlohmann/json $($json.version) verified"

    - name: Configure CMake
      run: cmake -S DexCorral -B DexCorral/build -G "Visual Studio 17 2022" -A x64

    - name: Build Release
      run: cmake --build DexCorral/build --config Release

    - name: Prepare portable readme
      shell: pwsh
      run: |
        Copy-Item "Distribute/PortableReadme.txt" -Destination "portable_readme.txt"
        Write-Host "Copied PortableReadme.txt for portable package"

    - name: Create Portable Package
      shell: pwsh
      run: |
        $version = "${{ steps.get_version.outputs.version }}"

        # Create staging directory
        New-Item -ItemType Directory -Force -Path "package"

        # Copy files
        Copy-Item "DexCorral/build/Release/DexCorral.exe" -Destination "package/"
        Copy-Item "DexCorral/build/Release/DexCorralHook.dll" -Destination "package/"
        Copy-Item "LICENSE" -Destination "package/"
        Copy-Item "portable_readme.txt" -Destination "package/readme.txt"

        # Create zip. The version goes in the filename so downloaded
        # portable packages stay distinguishable from one another.
        $zipName = "Portable_DexCorral_${version}.zip"
        Compress-Archive -Path "package/*" -DestinationPath $zipName -Force

        Write-Host "Created $zipName with contents:"
        Get-ChildItem "package"

    - name: Build Inno Setup Installer
      shell: pwsh
      run: |
        $version = "${{ steps.get_version.outputs.version }}"
        Write-Host "Building Inno Setup installer version $version"

        # Copy build output to where the .iss expects it (DexCorral/build/)
        # VS generator puts output in Release/ subfolder
        Copy-Item "DexCorral/build/Release/DexCorral.exe" -Destination "DexCorral/build/" -Force
        Copy-Item "DexCorral/build/Release/DexCorralHook.dll" -Destination "DexCorral/build/" -Force

        # Inno Setup 6 is pre-installed on windows-latest runners
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=$version "installer\innosetup\DexCorral.iss"
        if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }

        $setupFile = "installer\innosetup\output\DexCorral_${version}_Setup.exe"
        if (Test-Path $setupFile) {
          Copy-Item $setupFile "DexCorral_${version}_Setup.exe"
          Write-Host "Installer created: DexCorral_${version}_Setup.exe"
        } else {
          Write-Error "Installer not found at $setupFile"
          exit 1
        }

    # Ship the SBOM alongside the binaries. A bill of materials nobody receives
    # does not do the job it exists for.
    - name: Stage the SBOM for release
      shell: pwsh
      run: |
        $version = "${{ steps.get_version.outputs.version }}"
        $sbom = Get-Content "sbom/dexcorral.cdx.json" -Raw | ConvertFrom-Json

        # Stamp the build time. Kept out of the committed file on purpose - it
        # would churn on every commit and mean nothing there; on a published
        # artifact it says when this document was actually issued.
        $ts = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
        $sbom.metadata | Add-Member -NotePropertyName timestamp -NotePropertyValue $ts -Force

        # Write UTF-8 without a BOM explicitly: Windows PowerShell's Set-Content
        # adds one, and a BOM makes strict JSON parsers reject the document.
        $out = Join-Path $PWD "DexCorral_${version}_sbom.cdx.json"
        $utf8NoBom = New-Object System.Text.UTF8Encoding $false
        [System.IO.File]::WriteAllText($out, ($sbom | ConvertTo-Json -Depth 20), $utf8NoBom)
        Write-Host "Staged DexCorral_${version}_sbom.cdx.json ($ts)"

    - name: Prepare release notes
      shell: pwsh
      run: |
        $version = "${{ steps.get_version.outputs.version }}"

        # Fill the download table with the sizes of the artifacts we just
        # built, so the table can never drift from what the release ships.
        function Format-Size([string]$path) {
            if (-not (Test-Path $path)) { throw "Cannot size missing artifact: $path" }
            $bytes = (Get-Item $path).Length
            # Invariant culture: the release notes always use "2.3 MB",
            # never the runner locale's decimal comma.
            $inv = [cultureinfo]::InvariantCulture
            if ($bytes -ge 1MB) { return ($bytes / 1MB).ToString("N1", $inv) + " MB" }
            return ($bytes / 1KB).ToString("N0", $inv) + " KB"
        }

        # Checksums let a downloader verify the artifact. The binaries are
        # unsigned, so this is the only integrity check we can offer.
        function Get-Sha([string]$path) {
            if (-not (Test-Path $path)) { throw "Cannot hash missing artifact: $path" }
            return (Get-FileHash $path -Algorithm SHA256).Hash.ToLower()
        }

        $body = Get-Content "Distribute/RELEASE_TEMPLATE.md" -Raw
        $body = $body -replace '\$\{VERSION\}', $version
        $body = $body -replace '\$\{SETUP_SIZE\}', (Format-Size "DexCorral_${version}_Setup.exe")
        $body = $body -replace '\$\{PORTABLE_SIZE\}', (Format-Size "Portable_DexCorral_${version}.zip")
        $body = $body -replace '\$\{SBOM_SIZE\}', (Format-Size "DexCorral_${version}_sbom.cdx.json")
        $body = $body -replace '\$\{SETUP_SHA256\}', (Get-Sha "DexCorral_${version}_Setup.exe")
        $body = $body -replace '\$\{PORTABLE_SHA256\}', (Get-Sha "Portable_DexCorral_${version}.zip")
        Set-Content "release_notes.md" -Value $body

    - name: Create GitHub Release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
      with:
        tag_name: ${{ steps.get_version.outputs.tag }}
        name: DexCorral ${{ steps.get_version.outputs.tag }}
        body_path: release_notes.md
        files: |
          Portable_DexCorral_${{ steps.get_version.outputs.version }}.zip
          DexCorral_${{ steps.get_version.outputs.version }}_Setup.exe
          DexCorral_${{ steps.get_version.outputs.version }}_sbom.cdx.json
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: Check CLA signature
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: 'https://github.com/guHe330/DexCorral/blob/main/docs/CLA.md'
          path-to-signatures: 'signatures/version1/cla.json'
          branch: 'main'
          allowlist: guHe330,dependabot[bot],github-actions[bot],bot*
          custom-notsigned-prcomment: 'Thank you for your contribution to DexCorral. Before this pull request can be merged, please read the [Contributor License Agreement](https://github.com/guHe330/DexCorral/blob/main/docs/CLA.md) and sign it by posting the comment below. It is three lines: your contribution is licensed under the GPLv3, you have the right to submit it, and you keep your copyright.'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA. Thank you!'

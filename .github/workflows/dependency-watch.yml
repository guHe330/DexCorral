name: Dependency Watch

# C++ has no package manifest that Dependabot can read - it supports no C/C++
# ecosystem except Bazel, and neither vcpkg nor Conan. So this workflow does by
# hand what Dependabot would do: watch upstream for a new release, and check the
# vendored copy still matches what it claims to be.

on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Check nlohmann/json for a newer release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        header=DexCorral/include/nlohmann/json.hpp
        major=$(grep -oP '#define NLOHMANN_JSON_VERSION_MAJOR \K[0-9]+' "$header")
        minor=$(grep -oP '#define NLOHMANN_JSON_VERSION_MINOR \K[0-9]+' "$header")
        patch=$(grep -oP '#define NLOHMANN_JSON_VERSION_PATCH \K[0-9]+' "$header")
        vendored="$major.$minor.$patch"
        latest=$(gh api repos/nlohmann/json/releases/latest --jq .tag_name | sed 's/^v//')
        echo "vendored=$vendored latest=$latest"

        if [ "$vendored" = "$latest" ]; then
          echo "Up to date."
          exit 0
        fi

        title="nlohmann/json $latest is available (vendored: $vendored)"
        if gh issue list --state open --search "$title in:title" --json title \
             --jq '.[].title' | grep -qxF "$title"; then
          echo "Issue already open."
          exit 0
        fi

        gh issue create --title "$title" --body "$(cat <<EOF
        Upstream released **$latest**; \`$header\` is on **$vendored**.

        This is a notification, not an alert - a new release is not necessarily a
        security fix. Check the upstream changelog before deciding.

        To update:
        1. Download \`json.hpp\` from https://github.com/nlohmann/json/releases/tag/v$latest
        2. Replace \`$header\`
        3. Update the version, hash and purl for nlohmann/json in \`sbom/dexcorral.cdx.json\`
           (\`sha256sum\` of the new header) - CI fails until the SBOM matches the file
        4. Build and run the tests

        _Opened by \`.github/workflows/dependency-watch.yml\`._
        EOF
        )"

    - name: Scan the SBOM against the OSV database
      run: |
        # Pinned by version and content hash. Note that OSV's coverage of C/C++
        # libraries is thin - most C/C++ CVEs are only in NVD, keyed by CPE - so
        # a clean result here is weak evidence. The release watch above is the
        # real safety net; this catches the cases OSV does know about.
        curl -sSL -o osv-scanner \
          https://github.com/google/osv-scanner/releases/download/v2.5.1/osv-scanner_linux_amd64
        echo "f9f25499a2c8cc367b3af45df2ea7eeca7fbccceab9c35079968f4b3652194be  osv-scanner" \
          | sha256sum -c -
        chmod +x osv-scanner
        ./osv-scanner scan source --sbom=sbom/dexcorral.cdx.json

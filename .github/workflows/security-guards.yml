name: Security Guards

# Cheap guards against silently undoing a security fix. Runs on every push/PR,
# unlike build-release.yml which only fires on a version tag - by then a
# regression would already be in a release.

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

    # The update check must keep WinHTTP's default certificate validation.
    - name: No TLS validation overrides
      run: |
        if grep -rnE 'SECURITY_FLAG_IGNORE_|WINHTTP_OPTION_SECURITY_FLAGS' \
             DexCorral/src DexCorral/include DexCorral/ShellExtension; then
          echo "::error::TLS validation override found. The update check must use WinHTTP's default certificate validation."
          exit 1
        fi

    # The release URL comes from the GitHub API and is handed to ShellExecuteW,
    # so it must stay behind the allowlist.
    - name: Release URL allowlist still in place
      run: |
        if ! grep -q 'IsTrustedReleaseUrl' DexCorral/src/UpdateChecker.cpp; then
          echo "::error::Release URL allowlist missing from UpdateChecker.cpp."
          exit 1
        fi

    # The SBOM is hand-maintained (C++ has no manifest a tool could generate it
    # from), so it can drift from reality without anyone noticing. Tie it to the
    # file it describes: this also detects an edited or swapped vendored header.
    - name: SBOM matches the vendored header
      run: |
        header=DexCorral/include/nlohmann/json.hpp
        want=$(python3 -c "import json;print([c for c in json.load(open('sbom/dexcorral.cdx.json'))['components'] if c['name']=='json'][0]['hashes'][0]['content'])")
        got=$(sha256sum "$header" | cut -d' ' -f1)
        if [ "$want" != "$got" ]; then
          echo "::error::$header does not match the SHA-256 recorded in sbom/dexcorral.cdx.json (want $want, got $got). Update the SBOM if the bump was intentional."
          exit 1
        fi
        wantver=$(python3 -c "import json;print([c for c in json.load(open('sbom/dexcorral.cdx.json'))['components'] if c['name']=='json'][0]['version'])")
        gotver=$(grep -oP '#define NLOHMANN_JSON_VERSION_MAJOR \K[0-9]+' "$header").$(grep -oP '#define NLOHMANN_JSON_VERSION_MINOR \K[0-9]+' "$header").$(grep -oP '#define NLOHMANN_JSON_VERSION_PATCH \K[0-9]+' "$header")
        if [ "$wantver" != "$gotver" ]; then
          echo "::error::SBOM says nlohmann/json $wantver, header says $gotver."
          exit 1
        fi
        echo "SBOM agrees with $header ($gotver, $got)."

    # Version.h is the single source of truth for the version. The SBOM repeats
    # it (CycloneDX has nowhere to reference it from), so pin the two together
    # rather than trusting anyone to remember the second one at release time.
    - name: SBOM version matches Version.h
      run: |
        want=$(grep -oP '#define DEXCORRAL_VERSION L"\K[0-9.]+' DexCorral/include/Version.h)
        got=$(python3 -c "import json;print(json.load(open('sbom/dexcorral.cdx.json'))['metadata']['component']['version'])")
        purl=$(python3 -c "import json;print(json.load(open('sbom/dexcorral.cdx.json'))['metadata']['component']['purl'])")
        if [ "$want" != "$got" ]; then
          echo "::error::Version.h says $want, sbom/dexcorral.cdx.json says $got. Bump metadata.component.version (and its purl) with the release."
          exit 1
        fi
        if [ "$purl" != "pkg:github/guHe330/DexCorral@v$want" ]; then
          echo "::error::SBOM purl is $purl, expected pkg:github/guHe330/DexCorral@v$want."
          exit 1
        fi
        echo "SBOM product version agrees with Version.h ($want)."

    # A mutable action ref lets a compromised upstream run in the job that
    # builds and publishes releases, so pin every action to a commit SHA.
    - name: Actions pinned to commit SHAs
      run: |
        if grep -rnE '^\s*uses:' .github/workflows | grep -vE '@[0-9a-f]{40}(\s|$)'; then
          echo "::error::Unpinned GitHub Action above. Pin it to a full commit SHA."
          exit 1
        fi
